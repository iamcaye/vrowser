name: Task
description: Feature, fix, chore, or research task
title: "[area] "
labels: []
body:
  - type: textarea
    id: background
    attributes:
      label: Background and objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Technical scope
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Suggested files or modules
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use markdown checkboxes.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
    validations:
      required: true
